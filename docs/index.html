<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#202020">
<meta name="description" content="한글 자음·모음을 한 칸씩 채워 단어를 맞히는 워들. 원하는 만큼 여러 판 플레이할 수 있어요.">
<title>오늘의 단어</title>
<style>
/* 오늘의 단어 — 색상은 카카오톡 원본 스크린샷에서 직접 추출한 값 */
:root {
  /* 이 게임은 카톡 원본의 어두운 화면 하나로 고정된 디자인이다.
     호스트 페이지가 밝은 테마여도 폼 컨트롤·스크롤바까지 어둡게 그려지도록 명시한다. */
  color-scheme: dark;

  --bg: #202020;
  --bg-key: #1a1a1a;
  --line: #3a3a3c;
  --ink: #ffffff;
  --ink-dim: #8e8e93;
  --ink-on: #111111;
  --correct: #9cdd99;
  --present: #f8e483;
  --absent: #cccccc;
  --key: #2a2a2c;
  --accent: #f9e54e;
  /* 기능 키 색. 자모 키의 초록·노랑·회색 어디와도 겹치지 않아야 구분이 된다 */
  --fn: #3d5670;
  --fn-strong: #5b8ab8;
  --radius: 10px;
  --gap: 6px;
  /* 웹폰트를 쓰지 않는다: 파일을 그대로 열어도(오프라인) 동작해야 하고, 낱자모 ㄱ·ㅏ 는
     플랫폼 한글 서체가 가장 정확하게 그린다. 최신 한글 UI 서체부터 순서대로 둔다. */
  --font: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  touch-action: manipulation;
}
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
:focus-visible { outline: 2px solid var(--correct); outline-offset: 2px; border-radius: 6px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
h1, h2, h3, p { margin: 0; }

.app { display: flex; flex-direction: column; height: 100dvh; max-width: 560px; margin: 0 auto; }
.screen { display: flex; flex-direction: column; flex: 1; min-height: 0; }
[hidden] { display: none !important; }

/* ── 시작 화면 ─────────────────────────────────────────────────────── */
#home { align-items: center; justify-content: center; gap: 28px; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); }
.logo { font-size: clamp(30px, 9vw, 40px); font-weight: 800; letter-spacing: -0.02em; }
.tagline { color: var(--ink-dim); font-size: 14px; margin-top: -18px; text-align: center; line-height: 1.5; }
.sizes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip {
  padding: 9px 15px; border-radius: 999px; background: var(--key); color: var(--ink-dim);
  font-size: 14px; font-weight: 600; transition: background .12s, color .12s;
}
.chip[aria-pressed="true"] { background: var(--correct); color: var(--ink-on); }
.chip:disabled { opacity: .35; cursor: default; }
.menu { display: flex; flex-direction: column; gap: 10px; width: min(100%, 300px); }
.btn {
  padding: 15px; border-radius: var(--radius); background: var(--key);
  font-size: 16px; font-weight: 700; text-align: center;
}
.btn.primary { background: var(--correct); color: var(--ink-on); }
.btn.accent { background: var(--accent); color: var(--ink-on); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-dim); }
.home-links { display: flex; gap: 22px; }
.home-links button { color: var(--ink-dim); font-size: 14px; text-decoration: underline; text-underline-offset: 4px; }

/* ── 게임 화면 ─────────────────────────────────────────────────────── */
.topbar {
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
  padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,.06);
}
.topbar .title { text-align: center; line-height: 1.25; }
.topbar .title span { font-size: 17px; font-weight: 800; }
.topbar .title small { display: block; font-size: 11px; color: var(--ink-dim); }
.icon { font-size: 20px; padding: 8px; color: var(--ink-dim); border-radius: 8px; }
.invisible { visibility: hidden; pointer-events: none; }

/* ── 멀티플레이 로비 · 상대 보드 ─────────────────────────────────── */
.lobby-body { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 20px calc(24px + env(safe-area-inset-bottom)); text-align: center; }
.room-code { display: block; margin: 4px 0 18px; font-size: clamp(34px, 12vw, 54px); letter-spacing: .14em; }
.room-invite { display: flex; gap: 8px; align-items: stretch; margin-bottom: 24px; }
.room-invite .linkbox { height: auto; min-height: 46px; text-align: left; }
.room-invite .btn { flex: none; padding: 10px 14px; font-size: 13px; }
.lobby-heading { display: flex; justify-content: space-between; margin: 8px 2px; font-size: 14px; }
.lobby-heading span { color: var(--ink-dim); }
.roster { list-style: none; margin: 0; padding: 0; text-align: left; border-top: 1px solid rgba(255,255,255,.08); }
.roster li { display: flex; gap: 10px; align-items: center; min-height: 48px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 14px; }
.roster li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--correct); }
.roster li b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roster li span { margin-left: auto; color: var(--ink-dim); font-size: 12px; }
.lobby-actions { display: flex; flex-direction: column; gap: 9px; margin-top: 22px; }
.lobby-actions .muted { line-height: 1.5; }
.room-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px 0 18px; }

.peers {
  flex: none; display: flex; gap: 10px; overflow-x: auto; padding: 6px 10px;
  scrollbar-width: none; border-bottom: 1px solid rgba(255,255,255,.06);
}
.peers::-webkit-scrollbar { display: none; }
.peer { flex: none; text-align: center; }
.peer.offline { opacity: .4; }
.peer.done > b { color: var(--correct); }
.peer > b {
  display: block; font-size: 10px; color: var(--ink-dim); font-weight: 600;
  max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mini { display: grid; gap: 1.5px; margin-top: 3px; }
.mini-row { display: grid; grid-template-columns: repeat(var(--cols), 7px); gap: 1.5px; }
.mini-tile { width: 7px; height: 7px; border-radius: 1.5px; background: #38383b; }
.mini-tile.correct { background: var(--correct); }
.mini-tile.present { background: var(--present); }
.mini-tile.absent { background: var(--absent); }

.board-wrap { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: min(5vh, 38px) 10px 10px; min-height: 0; }
/* 보드 폭은 fitBoard() 가 실제 남은 가로·세로 공간을 재서 직접 넣는다.
   타일이 정사각형이라 폭이 곧 높이를 정하는데, CSS 만으로는 남은 높이를 알 수 없다. */
/* max-width 100% 는 안전장치다. 폭 계산이 어떤 이유로든 낡거나 어긋나도
   보드가 화면 밖으로 밀려 나가 한쪽으로 치우쳐 보이는 일은 없게 한다. */
.board { display: grid; gap: var(--gap); min-width: 0; max-width: 100%; flex: none; }
.row { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: var(--gap); }
.tile {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius); border: 1.5px solid var(--line);
  font-size: clamp(15px, calc(46vw / var(--cols)), 30px); font-weight: 600;
  color: var(--ink); user-select: none;
}
.tile.filled { border-color: #5a5a5e; }
.tile.correct, .tile.present, .tile.absent { border-color: transparent; color: var(--ink-on); }
.tile.correct { background: var(--correct); }
.tile.present { background: var(--present); }
.tile.absent  { background: var(--absent); }

@keyframes pop { from { transform: scale(.86); } to { transform: scale(1); } }
.tile.pop { animation: pop .1s ease-out; }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
.tile.flip { animation: flip .5s ease forwards; }
@keyframes shake { 10%,90% { transform: translateX(-3px); } 30%,70% { transform: translateX(6px); } 50% { transform: translateX(-6px); } }
.row.shake { animation: shake .5s; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-14px); } 60% { transform: translateY(-5px); } }
.tile.bounce { animation: bounce .6s ease; }

/* ── 토스트 ────────────────────────────────────────────────────────── */
.toast {
  position: fixed; left: 50%; top: 84px; transform: translateX(-50%); z-index: 40;
  background: var(--ink); color: var(--ink-on); padding: 11px 18px; border-radius: 8px;
  font-size: 14px; font-weight: 700; white-space: nowrap; pointer-events: none;
  box-shadow: 0 6px 22px rgba(0,0,0,.45);
}

/* ── 키보드 ────────────────────────────────────────────────────────── */
.keyboard {
  background: var(--bg-key); padding: 10px 5px calc(12px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 7px; flex: none;
}
.krow { display: flex; gap: 5px; justify-content: center; }
.key {
  flex: 0 0 calc((100% - 40px) / 9); min-width: 0; max-width: 46px; height: 54px; border-radius: 6px;
  background: var(--key); color: var(--ink); font-size: 17px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  transition: background .1s;
}
/* 지우기·제출은 자모가 아니라 동작 키라 따로 칠한다 */
.key.fn { background: var(--fn); color: #dce8f4; font-size: 20px; }
.key.submit { background: var(--fn-strong); color: #ffffff; font-weight: 800; }
.key.correct { background: var(--correct); color: var(--ink-on); }
.key.present { background: var(--present); color: var(--ink-on); }
.key.absent  { background: var(--absent); color: var(--ink-on); }
.key:active { opacity: .7; }

.resultbar { padding: 0 10px 10px; background: var(--bg-key); }
.resultbar .btn { background: var(--accent); color: var(--ink-on); width: 100%; }

/* ── 시트(규칙·기록·결과·출제) ─────────────────────────────────────── */
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.6); }
.sheet-card {
  position: relative; width: min(100%, 460px); max-height: 88dvh; overflow-y: auto;
  background: #262628; border-radius: 20px 20px 0 0; padding: 22px 20px calc(26px + env(safe-area-inset-bottom));
  animation: rise .22s ease-out;
}
@keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.sheet-card h2 { font-size: 19px; font-weight: 800; margin-bottom: 14px; }
.sheet-close { position: absolute; top: 14px; right: 14px; font-size: 22px; color: var(--ink-dim); padding: 6px; }
.sheet p, .sheet li { font-size: 14px; line-height: 1.65; color: #d8d8dc; }
.sheet ul { padding-left: 18px; margin: 8px 0; }
.sheet .example { display: flex; gap: 4px; margin: 8px 0 14px; }
.sheet .example .tile { width: 38px; aspect-ratio: 1; font-size: 17px; border-radius: 7px; }
.chips b {
  display: inline-flex; width: 25px; height: 25px; align-items: center; justify-content: center;
  background: #3a3a3c; color: var(--ink); border-radius: 6px;
  font-size: 14px; font-weight: 600; margin: 2px; vertical-align: middle;
}
.hr { height: 1px; background: rgba(255,255,255,.09); margin: 16px 0; }
.muted { color: var(--ink-dim); font-size: 13px; }
.kbd { background: #3a3a3c; border-radius: 4px; padding: 1px 6px; font-size: 13px; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin-bottom: 6px; }
.stat-grid b { display: block; font-size: 24px; font-weight: 800; }
.stat-grid span { font-size: 11px; color: var(--ink-dim); }
.dist { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
.dist-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.dist-row i { font-style: normal; width: 10px; color: var(--ink-dim); }
.dist-bar { background: #4a4a4e; border-radius: 3px; padding: 2px 6px; text-align: right; font-weight: 700; min-width: 26px; }
.dist-bar.hit { background: var(--correct); color: var(--ink-on); }

.share-grid { font-size: 19px; line-height: 1.35; letter-spacing: 2px; text-align: center; margin: 14px 0; }
.answer-reveal { text-align: center; margin: 6px 0 16px; }
.answer-reveal b { font-size: 30px; font-weight: 800; letter-spacing: .04em; }
.answer-reveal span { display: block; margin-top: 8px; }
.sheet-actions { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; }
.score-list { list-style: none; padding: 0; margin: 10px 0; }
.score-list li { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.score-list li b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score-list li span { color: var(--ink-dim); font-size: 12px; }

.field {
  width: 100%; padding: 14px; border-radius: var(--radius); background: #1c1c1e;
  border: 1px solid var(--line); color: var(--ink); font-size: 17px; font-family: inherit; text-align: center;
}
.field:focus { outline: none; border-color: var(--correct); }
.linkbox {
  width: 100%; padding: 12px; border-radius: var(--radius); background: #1c1c1e; border: 1px solid var(--line);
  color: var(--ink-dim); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  resize: none; height: 74px;
}
.check {
  display: flex; align-items: flex-start; gap: 10px; margin-top: 16px;
  font-size: 14px; line-height: 1.5; color: #d8d8dc; cursor: pointer;
}
.check input { width: 19px; height: 19px; margin: 1px 0 0; accent-color: var(--correct); flex: none; }
.check .muted { font-size: 12px; }
.textlink { color: var(--ink-dim); font-size: 14px; text-decoration: underline; text-underline-offset: 4px; padding: 6px; }

.hint { font-size: 13px; margin-top: 10px; min-height: 20px; }
.hint.ok { color: var(--correct); }
.hint.bad { color: #ff8f8f; }

@media (max-height: 660px) {
  .key { height: 46px; font-size: 16px; }
  .topbar { padding: 4px 6px; }
}
</style>
</head>
<body>

<div class="app">

  <!-- ── 시작 화면 ────────────────────────────────────────────────── -->
  <section id="home" class="screen">
    <h1 class="logo">오늘의 단어</h1>
    <p class="tagline">자음·모음을 한 칸씩 채워서<br>다섯 번 안에 단어를 맞혀보세요</p>

    <div class="sizes" id="sizePicker" role="group" aria-label="칸 수 선택">
      <button class="chip" data-size="4">4칸</button>
      <button class="chip" data-size="5">5칸</button>
      <button class="chip" data-size="6">6칸</button>
      <button class="chip" data-size="7">7칸</button>
      <button class="chip" data-size="0">랜덤</button>
    </div>

    <div class="menu">
      <button class="btn primary" data-go="daily">오늘의 문제</button>
      <button class="btn" data-go="free">무한 연습</button>
      <button class="btn ghost" data-go="compose">직접 출제하기</button>
      <button class="btn accent" data-go="rooms" id="btnRooms" hidden>같이 하기</button>
    </div>

    <div class="home-links">
      <button data-sheet="rules">규칙</button>
      <button data-sheet="stats">기록</button>
    </div>
  </section>

  <!-- ── 멀티플레이 로비 ──────────────────────────────────────────── -->
  <section id="lobby" class="screen" hidden>
    <header class="topbar">
      <button class="icon" data-go="leave" aria-label="나가기">&#8249;</button>
      <div class="title"><span>같이 하기</span><small id="lobbyStatus">연결하는 중…</small></div>
      <span></span>
    </header>
    <div class="lobby-body">
      <p class="muted">방 코드</p>
      <strong class="room-code" id="roomCode"></strong>
      <div id="roomInvite"></div>
      <div class="lobby-heading"><b>참가자</b><span id="roomCount"></span></div>
      <ul class="roster" id="roomRoster"></ul>
      <div class="lobby-actions" id="lobbyActions"></div>
    </div>
  </section>

  <!-- ── 게임 화면 ────────────────────────────────────────────────── -->
  <section id="game" class="screen" hidden>
    <header class="topbar">
      <button class="icon" id="btnBack" data-go="home" aria-label="처음으로">&#8249;</button>
      <div class="title"><span id="gameTitle">오늘의 단어</span><small id="gameSub"></small></div>
      <button class="icon" id="btnMenu" data-sheet="stats" aria-label="기록">&#9776;</button>
    </header>

    <div class="peers" id="peers" hidden></div>
    <div class="board-wrap"><div class="board" id="board"></div></div>

    <div class="keyboard" id="keyboard"></div>
    <div class="resultbar" id="resultbar" hidden>
      <button class="btn" data-sheet="result">결과보기</button>
    </div>
  </section>

</div>

<div class="toast" id="toast" hidden></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true"></div>
</div>

<script>
// 한글 자모 유틸 — 24자모 분해 / 두벌식 조합 / ASCII 인코딩 / 워들 채점
// 브라우저에서는 globalThis.Hangul, node 에서는 module.exports 로 노출된다.
;(function (root, factory) {
  const api = factory()
  if (typeof module === 'object' && module.exports) module.exports = api
  else root.Hangul = api
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict'

  // 게임에서 쓰는 자모 24개 (두벌식 키보드에서 시프트 없이 칠 수 있는 것)
  const CONSONANTS = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ'
  const VOWELS = 'ㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ'
  const ALPHABET = CONSONANTS + VOWELS // 24개, 인덱스가 곧 ASCII 인코딩 순서

  // 유니코드 완성형 음절 분해용 테이블
  const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ']
  const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ']
  const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ']

  // 24자모 밖의 자모를 기본 자모열로 펼치는 표
  const EXPAND = {
    // 쌍자음
    'ㄲ': 'ㄱㄱ', 'ㄸ': 'ㄷㄷ', 'ㅃ': 'ㅂㅂ', 'ㅆ': 'ㅅㅅ', 'ㅉ': 'ㅈㅈ',
    // 겹받침
    'ㄳ': 'ㄱㅅ', 'ㄵ': 'ㄴㅈ', 'ㄶ': 'ㄴㅎ', 'ㄺ': 'ㄹㄱ', 'ㄻ': 'ㄹㅁ', 'ㄼ': 'ㄹㅂ',
    'ㄽ': 'ㄹㅅ', 'ㄾ': 'ㄹㅌ', 'ㄿ': 'ㄹㅍ', 'ㅀ': 'ㄹㅎ', 'ㅄ': 'ㅂㅅ',
    // 복합모음
    'ㅐ': 'ㅏㅣ', 'ㅒ': 'ㅑㅣ', 'ㅔ': 'ㅓㅣ', 'ㅖ': 'ㅕㅣ', 'ㅘ': 'ㅗㅏ', 'ㅙ': 'ㅗㅏㅣ',

<script>
// Supabase Realtime 의 Broadcast + Presence 만 쓰는 작은 Phoenix 채널 클라이언트.

  'use strict'

  const CODE_ALPHABET = '23456789ABCDEFGHJKMNPQRSTVWXYZ'

  function encodeFrame(frame) { return JSON.stringify(frame) }
  function decodeFrame(text) {
    if (typeof text !== 'string') return null
    try {
      const value = JSON.parse(text)

    for (const [key, value] of Object.entries(state || {})) {
      for (const meta of presenceMetas(value)) {

        if (!pid) continue
        const joinedAt = Number(meta.joinedAt) || Date.now()
        const prev = roster.get(pid)
        if (!prev || joinedAt < prev.joinedAt) roster.set(pid, {

          nick: String(meta.nick || '이름 없음').slice(0, 16),

  }
  function broadcast(event, payload) {
    return push({ topic, event: 'broadcast', ref: nextRef(), join_ref: joinRef, payload: {
      type: 'broadcast', event, payload,
    } })
  }
  function flush() {
    while (queue.length && status === 'live') {
      const item = queue.shift()
      if (!broadcast(item.event, item.payload)) { queue.unshift(item); break }
    }
  }
  function publishRoster() { emit('roster', Array.from(roster.values())) }
  function track() {
    push({ topic, event: 'presence', ref: nextRef(), join_ref: joinRef, payload: {
      type: 'presence', event: 'track', payload: {
        nick: me.nick, pid: me.pid, joinedAt: me.joinedAt,
      },
    } })
  }
  function handleMessage(event) {
    const frame = decodeFrame(typeof event.data === 'string' ? event.data : '')
    if (!frame) return
    if (frame.event === 'phx_reply' && frame.ref === joinRef) {
      if (frame.payload?.status === 'ok') {
        retryCount = 0
        setStatus('live')
        track()
        flush()
      } else {
        setStatus('down')
        socket?.close()
      }
      return
    }
    if (frame.event === 'presence_state') {
      roster = normalizePresence(frame.payload)
      publishRoster()
      return
    }
    if (frame.event === 'presence_diff') {
      roster = mergePresence(roster, frame.payload?.joins, frame.payload?.leaves)
      publishRoster()
      return
    }
    if (frame.event === 'broadcast') {
      const eventName = frame.payload?.event
      if (eventName) emit(eventName, frame.payload?.payload || {})
      return
    }
    if (frame.event === 'phx_error' || frame.event === 'phx_close') socket?.close()
  }
  function scheduleRetry() {
    if (intentional || !code) return
    clearTimeout(retryTimer)
    setStatus('retry')
    const delay = Math.min(30000, 1000 * (2 ** retryCount++))
    retryTimer = setTimeout(openSocket, delay)
  }
  function openSocket() {
    if (intentional || !code) return
    clearTimeout(retryTimer)
    clearInterval(heartbeat)
    setStatus(retryCount ? 'retry' : 'connecting')
    try { socket = new root.WebSocket(wireUrl()) } catch (e) { scheduleRetry(); return }
    socket.addEventListener('open', () => {
      joinRef = nextRef()
      push({ topic, event: 'phx_join', ref: joinRef, join_ref: joinRef, payload: {
        config: {
          broadcast: { self: false, ack: false },
          presence: { key: me.pid, enabled: true },
          postgres_changes: [],
          private: false,
        },
        ...(String(cfg.key).split('.').length === 3 ? { access_token: cfg.key } : {}),
      } })
      heartbeat = setInterval(() => push({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: nextRef() }), 30000)
    })
    socket.addEventListener('message', handleMessage)
    socket.addEventListener('error', () => setStatus('down'))
    socket.addEventListener('close', () => {
      clearInterval(heartbeat)
      socket = null
      if (!intentional) scheduleRetry()
    })
  }
  function connect(nextCode, player) {
    if (!available) return Promise.reject(new Error('멀티플레이 설정이 없습니다'))
    leave()
    code = String(nextCode || '').toUpperCase()
    if (!/^[23456789ABCDEFGHJKMNPQRSTVWXYZ]{6}$/.test(code)) return Promise.reject(new Error('방 코드는 6자리입니다'))
    me = { pid: String(player.pid), nick: String(player.nick), joinedAt: Number(player.joinedAt) || Date.now() }
    topic = `realtime:tw:${code}`
    intentional = false
    openSocket()
    return new Promise((resolve, reject) => {
      const stop = on('status', (value) => {
        if (value === 'live') { stop(); clearTimeout(timer); resolve() }
      })
      const timer = setTimeout(() => { stop(); reject(new Error('방에 연결하는 중입니다')) }, 12000)
    })
  }
  function leave() {
    intentional = true
    clearTimeout(retryTimer)
    clearInterval(heartbeat)
    if (socket && socket.readyState === 1 && topic) push({ topic, event: 'phx_leave', payload: {}, ref: nextRef(), join_ref: joinRef })
    socket?.close()
    socket = null
    topic = null
    code = null
    me = null
    roster = new Map()
    queue.length = 0
    setStatus(available ? 'down' : 'off')
  }
  function send(event, payload) {
    if (!APP_EVENTS.includes(event)) return false
    if (status === 'live') return broadcast(event, payload)
    if (code) { queue.push({ event, payload }); return true }
    return false
  }

  return {
    available,
    get status() { return status },
    connect, leave, send, on,
    encodeFrame, decodeFrame, normalizePresence, mergePresence, electHost, roomCode, awardPoints,
    CODE_ALPHABET,
  }
})

<script>
// 오늘의 단어 — 게임 로직
// 보드는 자모 단위로만 다룬다. 조합된 글자는 정답을 공개할 때만 보여준다.
;(function () {
  'use strict'

  const H = globalThis.Hangul
  const W = globalThis.Words

  const MAX_TRIES = 5
  const SIZES = W.lengths                       // [4, 5, 6, 7]
  const BACK = '←'      // 지우기
  const ENTER = '↑'     // 제출
  const KEY_ROWS = [
    ['ㅂ', 'ㅈ', 'ㄷ', 'ㄱ', 'ㅅ', 'ㅛ', 'ㅕ', 'ㅑ', BACK],
    ['ㅁ', 'ㄴ', 'ㅇ', 'ㄹ', 'ㅎ', 'ㅗ', 'ㅓ', 'ㅏ', 'ㅣ'],
    ['ㅋ', 'ㅌ', 'ㅊ', 'ㅍ', 'ㅠ', 'ㅜ', 'ㅡ', ENTER],
  ]
  // 데스크톱 두벌식 자판. ㅐ·ㅔ 등은 게임 자모가 아니므로 두 칸으로 펼쳐서 넣는다.
  const QWERTY = {
    q: 'ㅂ', w: 'ㅈ', e: 'ㄷ', r: 'ㄱ', t: 'ㅅ', y: 'ㅛ', u: 'ㅕ', i: 'ㅑ', o: 'ㅐ', p: 'ㅔ',
    a: 'ㅁ', s: 'ㄴ', d: 'ㅇ', f: 'ㄹ', g: 'ㅎ', h: 'ㅗ', j: 'ㅓ', k: 'ㅏ', l: 'ㅣ',
    z: 'ㅋ', x: 'ㅌ', c: 'ㅊ', v: 'ㅍ', b: 'ㅠ', n: 'ㅜ', m: 'ㅡ',
  }
  const MARK_EMOJI = { correct: '\u{1F7E9}', present: '\u{1F7E8}', absent: '⬜' }
  const MODE_LABEL = {
    daily: '오늘의 문제', free: '무한 연습', custom: '친구가 낸 문제',
    versus: '같은 단어 대결', setter: '출제 대결', relay: '릴레이', coop: '협동',
  }

  const $ = (sel) => document.querySelector(sel)
  const el = { home: $('#home'), game: $('#game'), board: $('#board'), keyboard: $('#keyboard'),
    toast: $('#toast'), sheet: $('#sheet'), sheetCard: $('#sheetCard'), resultbar: $('#resultbar'),
    title: $('#gameTitle'), sub: $('#gameSub'), sizePicker: $('#sizePicker'),
    back: $('#btnBack'), menu: $('#btnMenu') }

  // ── 저장소 (샌드박스 iframe 에서 localStorage 가 막힐 수 있어 메모리로 폴백) ──
  const mem = {}
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); if (v != null) return JSON.parse(v) } catch (e) { /* 무시 */ }
      return key in mem ? mem[key] : fallback
    },
    set(key, value) {
      mem[key] = value
      try { localStorage.setItem(key, JSON.stringify(value)) } catch (e) { /* 무시 */ }
    },
  }

  // ── 날짜 · 난수 ──────────────────────────────────────────────────────
  function kstToday() {
    const now = new Date()
    const kst = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000)
    const p = (n) => String(n).padStart(2, '0')
    return `${kst.getFullYear()}-${p(kst.getMonth() + 1)}-${p(kst.getDate())}`
  }
  function mulberry32(seed) {
    let a = seed >>> 0
    return function () {
      a = (a + 0x6d2b79f5) >>> 0
      let t = Math.imul(a ^ (a >>> 15), 1 | a)
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296
    }
  }
  // 같은 날짜·칸수면 누구에게나 같은 문제가 나온다
  function dailyAnswer(date, size) {
    const rnd = mulberry32(Number(date.replace(/-/g, '')) * 131 + size * 7919)
    rnd(); rnd(); rnd()
    return W.answers[size][Math.floor(rnd() * W.answers[size].length)]
  }
  function freeAnswer(size) {
    const pool = W.answers[size]
    const recent = store.get('tw.recent.v1', {})
    const used = new Set(recent[size] || [])
    const fresh = pool.filter((w) => !used.has(w))
    const list = fresh.length ? fresh : pool
    const word = list[Math.floor(Math.random() * list.length)]
    const keep = Math.min(80, Math.floor(pool.length / 2))
    recent[size] = [...(recent[size] || []), word].slice(-keep)
    store.set('tw.recent.v1', recent)
    return word
  }

  // ── 커스텀 문제 링크 (#w=base64url) ─────────────────────────────────
  const b64url = {
    encode(text) {
      const bytes = new TextEncoder().encode(text)
      let bin = ''
      for (const b of bytes) bin += String.fromCharCode(b)
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
    },
    decode(text) {
      const bin = atob(text.replace(/-/g, '+').replace(/_/g, '/'))
      const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0))
      return new TextDecoder().decode(bytes)
    },
  }
  // 남에게 보내도 열리는 주소일 때만 링크를 만든다.
  // 아티팩트 안에서는 location 이 일회용 내부 프레임 주소(...frame.claudeusercontent.com/_f/...)라
  // 그대로 보내면 상대에게 'page not found' 가 뜬다. 그럴 땐 링크 대신 문제 코드를 준다.
  function shareUrl() {
    if (!/^https?:$/.test(location.protocol)) return null       // file:// 등
    if (window.self !== window.top) return null                 // iframe 안 (아티팩트 등)
    if (/\.frame\.claudeusercontent\.com$/.test(location.hostname)) return null
    if (location.pathname.startsWith('/_f/')) return null
    if (/__frame_[tv]=/.test(location.search)) return null
    return location.origin + location.pathname + location.search
  }

  // 링크든 코드든 붙여넣은 문자열에서 문제를 꺼낸다.
  // #p= 는 잠금 링크(그 문제 하나만 풀 수 있음), #w= 와 맨코드는 일반.
  function readPuzzle(text) {
    const raw = String(text || '').trim()
    const locked = /[#&?]p=([A-Za-z0-9_-]+)/.exec(raw)
    const match = locked || /[#&?]w=([A-Za-z0-9_-]+)/.exec(raw) || /^([A-Za-z0-9_-]+)$/.exec(raw)
    if (!match) return null
    let word
    try { word = b64url.decode(match[1]) } catch (e) { return null }
    const jamo = H.decompose(word || '')
    if (!jamo) return null
    const size = Array.from(jamo).length
    return SIZES.includes(size) ? { word, size, locked: Boolean(locked) } : null
  }

  // ── 상태 ─────────────────────────────────────────────────────────────
  let state = null
  let busy = false
  let judge = (guess) => H.score(guess, state.answerJamo)
  let pending = []
  let pickedSize = store.get('tw.settings.v1', { size: 5 }).size

  const isValid = (jamo) => W.validSet(jamo.length).has(H.encode(jamo))

  // locked = 잠금 링크로 들어온 경우. 그 문제 하나만 풀 수 있고 나머지 화면은 감춘다.
  function startGame(mode, size, word, locked) {
    const answer = word || (mode === 'daily' ? dailyAnswer(kstToday(), size) : freeAnswer(size))
    state = {
      mode, size, answer, locked: Boolean(locked),
      answerJamo: Array.from(H.decompose(answer)),
      guesses: [], current: [], status: 'playing',
      date: kstToday(), room: globalThis.Room?.current?.code || null,
    }
    if (mode === 'daily') restoreDaily()
    showGame()
  }

  // ── 오늘의 문제 진행 상황 저장/복원 ─────────────────────────────────
  const dailySlot = () => `${state.date}:${state.size}`
  function restoreDaily() {
    const saved = store.get('tw.daily.v1', {})[dailySlot()]
    if (!saved || saved.answer !== state.answer) return
    state.guesses = saved.guesses.map((g) => Array.from(g))
    state.status = saved.status
  }
  function saveDaily() {
    if (state.mode !== 'daily') return
    const all = store.get('tw.daily.v1', {})
    all[dailySlot()] = { answer: state.answer, guesses: state.guesses.map((g) => g.join('')), status: state.status }
    // 오래된 기록은 정리
    const keys = Object.keys(all).sort()
    for (const k of keys.slice(0, Math.max(0, keys.length - 24))) delete all[k]
    store.set('tw.daily.v1', all)
  }

  // ── 통계 ─────────────────────────────────────────────────────────────
  function loadStats() {
    const s = store.get('tw.stats.v1', {})
    for (const n of SIZES) {
      s[n] = s[n] || { played: 0, won: 0, dist: [0, 0, 0, 0, 0], streak: 0, max: 0, last: null }
    }
    return s
  }
  function recordResult() {
    if (state.mode !== 'daily' && state.mode !== 'free') return
    const stats = loadStats()
    const s = stats[state.size]
    s.played++
    if (state.status === 'won') { s.won++; s.dist[state.guesses.length - 1]++ }
    if (state.mode === 'daily') {
      if (state.status === 'won') {
        const yesterday = new Date(new Date(state.date + 'T00:00:00').getTime() - 86400000)
        const p = (n) => String(n).padStart(2, '0')
        const prev = `${yesterday.getFullYear()}-${p(yesterday.getMonth() + 1)}-${p(yesterday.getDate())}`
        s.streak = s.last === prev ? s.streak + 1 : 1
        s.max = Math.max(s.max, s.streak)
      } else s.streak = 0
      s.last = state.date
    }
    store.set('tw.stats.v1', stats)
  }

  // ── 화면 전환 ────────────────────────────────────────────────────────
  function showHome() {
    state = null
    if (location.hash) history.replaceState(null, '', location.pathname + location.search)
    el.game.hidden = true
    const lobby = $('#lobby')
    if (lobby) lobby.hidden = true
    el.home.hidden = false
    paintSizePicker()
  }
  function showGame() {
    closeSheet()          // 해시로 들어오면 열려 있던 시트가 그대로 남는다
    el.home.hidden = true
    const lobby = $('#lobby')
    if (lobby) lobby.hidden = true
    el.game.hidden = false
    el.resultbar.hidden = true
    // hidden 으로 감추면 그리드 칸이 무너져 제목이 눌린다. 자리는 남기고 안 보이게만 한다.
    el.back.classList.toggle('invisible', state.locked)
    el.menu.dataset.sheet = state.locked ? 'rules' : 'stats'
    el.menu.textContent = state.locked ? '?' : '☰'
    el.menu.setAttribute('aria-label', state.locked ? '규칙' : '기록')
    el.title.textContent = MODE_LABEL[state.mode]
    el.sub.textContent = state.mode === 'daily'
      ? `${state.date} · ${state.size}칸`
      : `${state.size}칸 · ${MAX_TRIES}번 안에`
    buildBoard()
    buildKeyboard()
    fitBoard()
    paint()
    if (state.status !== 'playing') finish(true)
  }
  function paintSizePicker() {
    for (const chip of el.sizePicker.children) {
      chip.setAttribute('aria-pressed', String(Number(chip.dataset.size) === pickedSize))
    }
  }
  const resolveSize = () => (pickedSize === 0 ? SIZES[Math.floor(Math.random() * SIZES.length)] : pickedSize)

  // ── 보드 · 키보드 ────────────────────────────────────────────────────
  function buildBoard() {
    el.board.style.setProperty('--cols', state.size)
    el.board.innerHTML = ''
    for (let r = 0; r < MAX_TRIES; r++) {
      const row = document.createElement('div')
      row.className = 'row'
      for (let c = 0; c < state.size; c++) row.appendChild(document.createElement('div')).className = 'tile'
      el.board.appendChild(row)
    }
  }
  // 타일은 정사각형이라 보드 폭이 곧 보드 높이를 정한다. 남은 가로·세로 공간 중
  // 빠듯한 쪽에 맞춰 타일 한 변을 정하고, 그만큼만 보드에 준다.
  const TILE_MAX = 68
  const TILE_MIN = 24
  const GAP = 6
  function fitBoard() {
    if (!state || el.game.hidden) return
    const wrap = el.board.parentElement
    const style = getComputedStyle(wrap)
    const availWidth = wrap.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight)
    const availHeight = wrap.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom)
    // 아직 레이아웃이 잡히기 전이면 건드리지 않는다. 여기서 음수 폭을 넣으면
    // 브라우저가 그 값을 버리고 직전 판의 폭이 그대로 남아 보드가 어긋난다.
    if (!(availWidth > 0 && availHeight > 0)) return
    const tile = Math.max(TILE_MIN, Math.min(
      TILE_MAX,
      (availWidth - GAP * (state.size - 1)) / state.size,
      (availHeight - GAP * (MAX_TRIES - 1)) / MAX_TRIES,
    ))
    el.board.style.width = Math.floor(tile * state.size + GAP * (state.size - 1)) + 'px'
  }
  // 남은 공간이 바뀌면 언제든 다시 맞춘다 — 모바일 주소창이 접히거나, 결과 바가 뜨거나,
  // 화면을 돌리거나, 화면 전환 직후 레이아웃이 늦게 잡히는 경우까지 한 번에 덮는다.
  if (typeof ResizeObserver === 'function') new ResizeObserver(fitBoard).observe(el.board.parentElement)
  else addEventListener('resize', fitBoard)

  function buildKeyboard() {
    el.keyboard.innerHTML = ''
    for (const keys of KEY_ROWS) {
      const row = document.createElement('div')
      row.className = 'krow'
      for (const k of keys) {
        const b = document.createElement('button')
        b.className = 'key' + (k === BACK ? ' fn' : k === ENTER ? ' fn submit' : '')
        b.textContent = k
        b.dataset.key = k
        if (k === BACK) b.setAttribute('aria-label', '지우기')
        if (k === ENTER) b.setAttribute('aria-label', '제출')
        row.appendChild(b)
      }
      el.keyboard.appendChild(row)
    }
  }

  // 제출된 줄과 입력 중인 줄을 그린다. reveal 로 지정한 줄은 색을 칠하지 않는다(애니메이션이 칠함).
  function paint(reveal) {
    state.guesses.forEach((guess, r) => {
      const marks = H.score(guess, state.answerJamo)
      const tiles = el.board.children[r].children
      for (let c = 0; c < state.size; c++) {
        tiles[c].textContent = guess[c]
        tiles[c].className = 'tile' + (r === reveal ? ' filled' : ' ' + marks[c])
      }
    })
    const r = state.guesses.length
    if (r < MAX_TRIES) {
      const tiles = el.board.children[r].children
      for (let c = 0; c < state.size; c++) {
        tiles[c].textContent = state.current[c] || ''
        tiles[c].className = 'tile' + (state.current[c] ? ' filled' : '')
      }
    }
    if (reveal === undefined) paintKeyboard()
  }
  function paintKeyboard() {
    const rank = { absent: 1, present: 2, correct: 3 }
    const best = {}
    for (const guess of state.guesses) {
      const marks = H.score(guess, state.answerJamo)
      guess.forEach((j, i) => {
        if (!best[j] || rank[marks[i]] > rank[best[j]]) best[j] = marks[i]
      })
    }
    for (const b of el.keyboard.querySelectorAll('.key')) {
      const key = b.dataset.key
      const mark = best[key]
      b.className = 'key' + (key === BACK ? ' fn' : key === ENTER ? ' fn submit' : '') + (mark ? ' ' + mark : '')
    }
  }

  // ── 입력 ─────────────────────────────────────────────────────────────
  function press(key) {
    if (!state || busy || state.status !== 'playing') return
    if (key === BACK) { state.current.pop(); paint(); return }
    if (key === ENTER) { submit(); return }
    if (state.current.length >= state.size) return
    // ㅐ·ㄲ 같은 자모를 눌렀다면 두 칸으로 펼쳐 넣는다
    const parts = Array.from(H.expand(key))
    if (!parts.length) return
    for (const p of parts) {
      if (state.current.length >= state.size) break
      state.current.push(p)
    }
    paint()
    const tiles = el.board.children[state.guesses.length].children
    const last = tiles[state.current.length - 1]
    if (last) { last.classList.remove('pop'); void last.offsetWidth; last.classList.add('pop') }
  }

  async function submit() {
    const guess = state.current
    if (guess.length < state.size) return reject('자모를 다 채워주세요')
    if (!isValid(guess)) return reject('사전에 없는 단어예요')

    // 비동기 채점기로 교체해도 같은 입력이 두 번 제출되지 않게 채점 전에 잠근다.
    busy = true
    const activeState = state
    let marks
    try { marks = await judge(guess.slice()) } catch (e) {
      busy = false
      toast('채점하지 못했어요. 다시 시도해 주세요')
      return
    }
    if (state !== activeState) { busy = false; return }

    state.guesses.push(guess.slice())
    state.current = []
    const rowIndex = state.guesses.length - 1
    paint(rowIndex)

    const won = marks.every((m) => m === 'correct')
    if (won) state.status = 'won'
    else if (state.guesses.length >= MAX_TRIES) state.status = 'lost'
    if (state.room) globalThis.Room?.localMark(rowIndex, marks)

    const tiles = el.board.children[rowIndex].children
    marks.forEach((mark, i) => {
      setTimeout(() => {
        tiles[i].classList.add('flip')
        setTimeout(() => { tiles[i].classList.add(mark); tiles[i].classList.remove('filled') }, 220)
      }, i * 180)
    })
    setTimeout(() => {
      busy = false
      paintKeyboard()
      saveDaily()
      if (state.status !== 'playing') {
        recordResult()
        if (state.room) globalThis.Room?.localDone(state.status, state.guesses.length)
        finish()
      }
      const q = pending
      pending = []
      for (const fn of q) { try { fn() } catch (e) { /* 원격 이벤트 하나가 뒤 큐를 막지 않게 한다 */ } }
    }, marks.length * 180 + 420)
  }
  function setJudge(next) { judge = typeof next === 'function' ? next : (guess) => H.score(guess, state.answerJamo) }
  function applyRemote(fn) { if (busy) pending.push(fn); else fn() }
  function reject(message) {
    toast(message)
    const row = el.board.children[state.guesses.length]
    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake')
  }

  function finish(restored) {
    if (state.room) { el.resultbar.hidden = true; return }
    el.resultbar.hidden = false
    if (state.status === 'won' && !restored) {
      const tiles = el.board.children[state.guesses.length - 1].children
      Array.from(tiles).forEach((t, i) => setTimeout(() => t.classList.add('bounce'), i * 90))
      setTimeout(() => openSheet('result'), 900)
    } else if (!restored) {
      toast('정답은 ' + state.answer, 2400)
      setTimeout(() => openSheet('result'), 1500)
    }
  }

  let toastTimer
  function toast(message, ms = 1400) {
    el.toast.textContent = message
    el.toast.hidden = false
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => { el.toast.hidden = true }, ms)
  }

  // ── 공유 문구 ────────────────────────────────────────────────────────
  function shareGrid() {
    return state.guesses
      .map((g) => H.score(g, state.answerJamo).map((m) => MARK_EMOJI[m]).join(''))
      .join('\n')
  }
  function shareText() {
    const score = state.status === 'won' ? `${state.guesses.length}/${MAX_TRIES}` : `X/${MAX_TRIES}`
    const head = state.mode === 'daily'
      ? `오늘의 단어 ${state.size}칸 · ${state.date} · ${score}`
      : `${MODE_LABEL[state.mode]} ${state.size}칸 · ${score}`
    const base = shareUrl()
    const link = base && state.mode === 'custom' ? base + location.hash : base
    return [head, shareGrid(), link].filter(Boolean).join('\n')
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true } catch (e) { /* 폴백 */ }
    try {
      const ta = document.createElement('textarea')
      ta.value = text
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'
      document.body.appendChild(ta)
      ta.select()
      const ok = document.execCommand('copy')
      ta.remove()
      return ok
    } catch (e) { return false }
  }
  async function copyAndTell(text, okMessage) {
    if (await copyText(text)) toast(okMessage)
    else openSheet('copy', text)          // 클립보드가 막힌 환경 폴백
  }

  // ── 시트 ─────────────────────────────────────────────────────────────
  // 낱자모 ㅣ 는 세로줄처럼 보여서, 자모열은 작은 타일로 보여 준다
  const jamoChips = (jamo) => `<span class="chips">${Array.from(jamo).map((j) => `<b>${j}</b>`).join('')}</span>`
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

  function openSheet(kind, payload) {
    const html = SHEETS[kind](payload)
    el.sheetCard.innerHTML = `<button class="sheet-close" data-close aria-label="닫기">&times;</button>${html}`
    el.sheet.hidden = false
    el.sheetCard.scrollTop = 0
    const field = el.sheetCard.querySelector('[autofocus]')
    if (field) setTimeout(() => field.focus(), 60)
  }
  const closeSheet = () => { el.sheet.hidden = true }

  const SHEETS = {
    rules: () => `
      <h2>규칙</h2>
      <p>숨겨진 단어를 <b>다섯 번</b> 안에 맞히세요. 자음과 모음이 <b>한 칸씩</b> 들어갑니다.</p>
      <div class="hr"></div>
      <p><b>복합모음과 쌍자음은 두 칸을 씁니다.</b></p>
      <ul>
        <li>ㅐ = ㅏ + ㅣ &nbsp;·&nbsp; ㅔ = ㅓ + ㅣ &nbsp;·&nbsp; ㅘ = ㅗ + ㅏ &nbsp;·&nbsp; ㅢ = ㅡ + ㅣ</li>
        <li>ㄲ = ㄱ + ㄱ &nbsp;·&nbsp; ㅆ = ㅅ + ㅅ</li>
        <li>겹받침 ㄳ = ㄱ + ㅅ &nbsp;·&nbsp; ㄼ = ㄹ + ㅂ</li>
      </ul>
      <p class="muted">시민 ${jamoChips('ㅅㅣㅁㅣㄴ')} 5칸</p>
      <p class="muted">전세 ${jamoChips('ㅈㅓㄴㅅㅓㅣ')} 6칸 &nbsp;— ㅔ 가 ㅓ + ㅣ 로 나뉩니다</p>
      <div class="hr"></div>
      <p><b>색으로 알려줍니다.</b></p>
      <div class="example">
        <div class="tile correct">ㅅ</div><div class="tile">ㅜ</div><div class="tile">ㅁ</div>
      </div>
      <p>ㅅ 은 <b>그 자리에</b> 있습니다.</p>
      <div class="example">
        <div class="tile">ㄱ</div><div class="tile present">ㅁ</div><div class="tile">ㅏ</div>
      </div>
      <p>ㅁ 은 단어에 있지만 <b>자리가 다릅니다</b>.</p>
      <div class="example">
        <div class="tile">ㅈ</div><div class="tile">ㅓ</div><div class="tile absent">ㅍ</div>
      </div>
      <p>ㅍ 은 <b>아예 없습니다</b>.</p>
      <p class="muted" style="margin-top:10px">같은 자모가 여러 번 쓰였다면 정답에 들어 있는 개수만큼만 색이 칠해집니다.</p>
      <div class="hr"></div>
      <p class="muted">컴퓨터에서는 두벌식 자판(<span class="kbd">r</span>=ㄱ, <span class="kbd">k</span>=ㅏ …)으로 칠 수 있고
      <span class="kbd">Enter</span> 제출, <span class="kbd">Backspace</span> 로 지웁니다.</p>`,

    stats: () => {
      const stats = loadStats()
      const total = SIZES.reduce((a, n) => ({
        played: a.played + stats[n].played,
        won: a.won + stats[n].won,
        dist: a.dist.map((v, i) => v + stats[n].dist[i]),
      }), { played: 0, won: 0, dist: [0, 0, 0, 0, 0] })
      const streak = state ? stats[state.size].streak : Math.max(...SIZES.map((n) => stats[n].streak))
      const max = Math.max(...SIZES.map((n) => stats[n].max))
      const rate = total.played ? Math.round((total.won / total.played) * 100) : 0
      const peak = Math.max(1, ...total.dist)
      const lastTry = state && state.status === 'won' ? state.guesses.length : 0
      const rows = total.dist.map((v, i) => `
        <div class="dist-row"><i>${i + 1}</i>
          <div class="dist-bar${i + 1 === lastTry ? ' hit' : ''}" style="width:${Math.max(8, (v / peak) * 100)}%">${v}</div>
        </div>`).join('')
      const bySize = SIZES.map((n) => `${n}칸 ${stats[n].won}/${stats[n].played}`).join(' · ')
      return `
        <h2>기록</h2>
        <div class="stat-grid">
          <div><b>${total.played}</b><span>플레이</span></div>
          <div><b>${rate}</b><span>승률 %</span></div>
          <div><b>${streak}</b><span>연승</span></div>
          <div><b>${max}</b><span>최고 연승</span></div>
        </div>
        <p class="muted" style="text-align:center">${bySize}</p>
        <div class="hr"></div>
        <p><b>맞힌 횟수 분포</b></p>
        <div class="dist">${rows}</div>
        <p class="muted" style="margin-top:14px">연승은 <b>오늘의 문제</b>를 이어서 맞힐 때만 올라갑니다. 친구가 낸 문제는 기록에 넣지 않아요.</p>`
    },

    result: () => {
      const won = state.status === 'won'
      const head = won ? `${state.guesses.length}번 만에 맞혔어요` : '아쉬워요'
      const reveal = `
        <h2>${head}</h2>
        <div class="answer-reveal">
          <b>${esc(state.answer)}</b>
          <span>${jamoChips(state.answerJamo.join(''))}</span>
        </div>
        <div class="share-grid">${shareGrid().split('\n').join('<br>')}</div>`
      // 잠금 링크로 들어왔으면 이 문제 하나로 끝. 전체 게임으로 가는 길만 작게 남긴다.
      if (state.locked) {
        return `${reveal}
        <div class="sheet-actions">
          <button class="btn accent" data-act="share">결과 복사하기</button>
        </div>
        <p style="text-align:center;margin-top:18px">
          <button class="textlink" data-go="home">나도 문제 내보기</button>
        </p>`
      }
      const again = state.mode === 'daily'
        ? `<button class="btn" data-go="free">무한 연습으로 계속하기</button>`
        : `<button class="btn" data-go="again">새 문제 풀기</button>`
      return `${reveal}
        <div class="sheet-actions">
          <button class="btn accent" data-act="share">결과 복사하기</button>
          ${again}
          <button class="btn ghost" data-sheet="compose">직접 출제하기</button>
          <button class="btn ghost" data-sheet="stats">기록 보기</button>
        </div>`
    },

    compose: () => {
      const linkable = shareUrl() !== null
      return `
      <h2>직접 출제하기</h2>
      <p class="muted">${linkable
        ? '단어를 정하면 링크가 만들어집니다. 카톡으로 보내면 친구가 바로 풀 수 있어요.'
        : '단어를 정하면 <b>문제 코드</b>가 만들어집니다. 지금 주소는 남에게 보내면 열리지 않는 임시 주소라, 링크 대신 코드를 씁니다.'}</p>
      <div style="margin:16px 0 0">
        <input class="field" id="composeInput" autofocus placeholder="예: 시민" maxlength="4"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="hint" id="composeHint"></div>
      </div>
      ${linkable ? `
      <label class="check">
        <input type="checkbox" id="composeLock" checked>
        <span>이 링크로는 <b>이 문제 하나만</b> 풀 수 있게<br>
          <span class="muted">끄면 친구가 다른 모드도 자유롭게 쓸 수 있어요</span></span>
      </label>` : ''}
      <div class="sheet-actions">
        <button class="btn primary" id="composeMake" data-act="make-link" disabled>${linkable ? '링크 만들기' : '문제 코드 만들기'}</button>
      </div>
      <div id="composeOut" hidden style="margin-top:16px">
        <textarea class="linkbox" id="composeLink" readonly></textarea>
        <p class="muted" id="composeNote" style="margin-top:8px"></p>
        <div class="sheet-actions">
          <button class="btn accent" data-act="copy-link" id="composeCopy">복사하기</button>
          <button class="btn ghost" data-act="try-link">내가 먼저 풀어보기</button>
        </div>
      </div>
      <div class="hr"></div>
      <h2 style="font-size:16px">친구가 준 문제 풀기</h2>
      <p class="muted">받은 링크나 문제 코드를 그대로 붙여넣으면 됩니다.</p>
      <div style="margin-top:12px">
        <input class="field" id="joinInput" placeholder="링크 또는 코드 붙여넣기"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="hint" id="joinHint"></div>
      </div>
      <div class="sheet-actions">
        <button class="btn" data-act="join">풀어보기</button>
      </div>`
    },

    copy: (text) => `
      <h2>복사가 막혀 있어요</h2>
      <p class="muted">아래 내용을 길게 눌러 직접 복사해 주세요.</p>
      <textarea class="linkbox" style="height:150px" readonly>${esc(text)}</textarea>`,
  }

  // ── 출제 화면 동작 ───────────────────────────────────────────────────
  let composedWord = null
  function onComposeInput() {
    const input = $('#composeInput')
    const hint = $('#composeHint')
    const make = $('#composeMake')
    const out = $('#composeOut')
    out.hidden = true
    composedWord = null
    make.disabled = true

    const word = input.value.trim()
    if (!word) { hint.textContent = ''; hint.className = 'hint'; return }
    const jamo = H.decompose(word)
    const bad = (msg) => { hint.textContent = msg; hint.className = 'hint bad' }
    if (!jamo) return bad('한글 단어만 낼 수 있어요')
    const n = Array.from(jamo).length
    if (!SIZES.includes(n)) return bad(`자모가 ${n}칸이에요. ${SIZES[0]}~${SIZES[SIZES.length - 1]}칸만 낼 수 있어요`)
    if (!isValid(Array.from(jamo))) return bad('사전에 없는 단어라 친구가 제출할 수 없어요')

    composedWord = word
    hint.textContent = `${n}칸 · ${Array.from(jamo).join(' ')}`
    hint.className = 'hint ok'
    make.disabled = false
  }
  function joinPuzzle() {
    const puzzle = readPuzzle($('#joinInput').value)
    const hint = $('#joinHint')
    if (!puzzle) {
      hint.textContent = '문제를 읽지 못했어요. 링크 전체를 붙여넣어 주세요'
      hint.className = 'hint bad'
      return
    }
    closeSheet()
    startGame('custom', puzzle.size, puzzle.word)
  }
  function makeLink() {
    if (!composedWord) return
    const code = b64url.encode(composedWord)
    const base = shareUrl()
    const lock = $('#composeLock')
    const locked = Boolean(lock && lock.checked)
    $('#composeLink').value = base ? `${base}#${locked ? 'p' : 'w'}=${code}` : code
    $('#composeNote').textContent = !base
      ? '게임 주소와 이 코드를 함께 보내세요. 친구는 아래 “친구가 준 문제 풀기” 칸에 코드를 넣으면 됩니다.'
      : locked
        ? '이 링크로 들어가면 이 문제만 나옵니다. 다른 모드는 보이지 않아요.'
        : '이 링크를 카톡으로 보내면 친구가 바로 풀 수 있어요.'
    $('#composeCopy').textContent = base ? '링크 복사하기' : '문제 코드 복사하기'
    $('#composeOut').hidden = false
    $('#composeOut').scrollIntoView({ behavior: 'smooth', block: 'nearest' })
  }

  // 다른 기능 파일이 화면 이동과 액션을 자기 키로 등록할 수 있는 작은 확장점.
  const GOES = {
    home: showHome,
    again: () => startGame(state.mode === 'custom' ? 'free' : state.mode, resolveSize()),
    daily: () => startGame('daily', resolveSize()),
    free: () => startGame('free', resolveSize()),
    compose: () => openSheet('compose'),
  }
  const ACTIONS = {
    'make-link': makeLink,
    join: joinPuzzle,
    share: () => copyAndTell(shareText(), '결과를 복사했어요'),
    'copy-link': () => copyAndTell($('#composeLink').value, shareUrl() ? '링크를 복사했어요' : '문제 코드를 복사했어요'),
    'try-link': () => { closeSheet(); startGame('custom', Array.from(H.decompose(composedWord)).length, composedWord) },
  }

  // ── 이벤트 ───────────────────────────────────────────────────────────
  document.addEventListener('click', (ev) => {
    const target = ev.target.closest('[data-key],[data-go],[data-sheet],[data-act],[data-close],[data-size]')
    if (!target) {
      if (ev.target === el.sheet) closeSheet()
      return
    }
    if (target.dataset.key !== undefined) return press(target.dataset.key)
    if (target.dataset.close !== undefined) return closeSheet()

    if (target.dataset.size !== undefined) {
      pickedSize = Number(target.dataset.size)
      store.set('tw.settings.v1', { size: pickedSize })
      return paintSizePicker()
    }
    if (target.dataset.go) {
      closeSheet()
      const fn = GOES[target.dataset.go]
      if (fn) return fn(target, ev)
    }
    if (target.dataset.sheet) return openSheet(target.dataset.sheet)

    if (target.dataset.act) {
      const fn = ACTIONS[target.dataset.act]
      if (fn) return fn(target, ev)
    }
  })

  document.addEventListener('input', (ev) => { if (ev.target.id === 'composeInput') onComposeInput() })
  // 잠금 체크를 바꾸면 이미 만들어 둔 링크도 따라 바뀌어야 한다
  document.addEventListener('change', (ev) => {
    if (ev.target.id === 'composeLock' && composedWord && !$('#composeOut').hidden) makeLink()
  })
  document.addEventListener('keydown', (ev) => {
    if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA') {
      if (ev.key === 'Enter' && ev.target.id === 'composeInput' && composedWord) makeLink()
      if (ev.key === 'Enter' && ev.target.id === 'joinInput') joinPuzzle()
      return
    }
    if (!el.sheet.hidden) { if (ev.key === 'Escape') closeSheet(); return }
    if (el.game.hidden) return
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return
    if (ev.key === 'Enter') { ev.preventDefault(); return press(ENTER) }
    if (ev.key === 'Backspace') { ev.preventDefault(); return press(BACK) }
    const ch = ev.key.length === 1 ? ev.key : ''
    if (!ch) return
    if (H.ALPHABET.includes(ch)) return press(ch)
    const mapped = QWERTY[ch.toLowerCase()]
    if (mapped) { ev.preventDefault(); press(mapped) }
    else if (H.expand(ch)) press(ch)               // 한글 IME 로 친 ㅐ·ㄲ 등
  })
  // ── 시작 ─────────────────────────────────────────────────────────────
  function bootFromHash() {
    const roomMatch = /[#&]r=([23456789ABCDEFGHJKMNPQRSTVWXYZ]{6})/i.exec(location.hash)
    if (roomMatch) {
      globalThis.TWRoomHash = roomMatch[1].toUpperCase()
      return false
    }
    if (!/[#&]([wpr])=/.test(location.hash)) return false
    const puzzle = readPuzzle(location.hash)
    if (!puzzle) return false
    startGame('custom', puzzle.size, puzzle.word, puzzle.locked)
    return true
  }
  paintSizePicker()
  if (!bootFromHash()) showHome()
  window.addEventListener('hashchange', () => { if (!bootFromHash()) showHome() })

  // 브라우저 콘솔·자동 테스트용 훅
  globalThis.TW = {
    press, submit, startGame,
    get state() { return state },
    get busy() { return busy },
    shareText, shareUrl, freeAnswer, resolveSize,
    SHEETS, GOES, ACTIONS, openSheet, closeSheet, toast, store, isValid, b64url,
    MAX_TRIES, SIZES, setJudge, applyRemote,
    repaint: () => { if (state) paint() },
    restoreRoomGame: (guesses, status = 'playing') => {
      if (!state || !state.room) return
      state.guesses = (guesses || []).map((guess) => Array.from(guess).slice(0, state.size))
      state.current = []
      state.status = ['playing', 'won', 'lost'].includes(status) ? status : 'playing'
      paint()
    },
    endRoomGame: () => {
      if (!state || !state.room || state.status !== 'playing') return
      state.status = 'lost'
      state.current = []
      paint()
      el.resultbar.hidden = true
    },
    copyAndTell,
  }
})()
</script>
<script>
// 멀티플레이 방 UI와 상태 기계. 네트워크 구현 세부사항은 Net 에만 맡긴다.
;(function () {
  'use strict'

  const Net = globalThis.Net
  const TW = globalThis.TW
  const H = globalThis.Hangul
  const $ = (sel) => document.querySelector(sel)

  const MARK_TO_WIRE = { absent: '0', present: '1', correct: '2' }
  const WIRE_TO_MARK = ['absent', 'present', 'correct']

  let room = null
  let draft = { kind: 'versus', size: 5, roundsTotal: 1 }

  function makePid() {

    else for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256)
    return Array.from(bytes, (n) => n.toString(36).padStart(2, '0')).join('')
  }
  function savedPlayer() {
    const saved = TW.store.get('tw.player.v1', {})
    return { pid: saved.pid || makePid(), nick: saved.nick || '' }
  }
  function normalizeCode(value) {
    const match = String(value || '').toUpperCase().match(/(?:[#&?]r=)?([23456789ABCDEFGHJKMNPQRSTVWXYZ]{6})(?:\b|$)/)
    return match ? match[1] : null
  }
  function inviteText() {
    const base = TW.shareUrl()
    return base ? `${base}#r=${room.code}` : room.code
  }
  function playerRows(player) {
    if (!player.rows) player.rows = []
    return player.rows
  }
  function displayNames(players) {
    const counts = new Map()
    return players.map((player) => {
      const n = (counts.get(player.nick) || 0) + 1
      counts.set(player.nick, n)
      return [player.pid, n === 1 ? player.nick : `${player.nick}${n}`]
    })
  }
  function players() { return room ? Array.from(room.peers.values()) : [] }
  function persistRoom() {
    if (!room) return TW.store.set('tw.room.v1', null)
    const state = TW.state
    TW.store.set('tw.room.v1', {
      code: room.code, nick: room.me.nick, kind: room.kind, size: room.size,
      round: room.round, roundsTotal: room.roundsTotal,
      active: Boolean(room.startedAt),
      guesses: state?.room === room.code ? state.guesses.map((guess) => H.encode(guess)) : [],
      status: state?.room === room.code ? state.status : 'playing',
    })
  }

  TW.SHEETS.rooms = () => {
    const player = savedPlayer()
    const preset = globalThis.TWRoomHash || ''
    return `
      <h2>같이 하기</h2>
      <p class="muted">친구들과 같은 문제를 동시에 풀고, 서로의 색상 보드를 실시간으로 볼 수 있어요.</p>
      <div style="margin-top:16px">
        <input class="field" id="roomNick" ${preset ? 'autofocus' : ''} placeholder="닉네임" maxlength="16"
               value="${esc(player.nick)}" autocomplete="nickname" autocapitalize="off" spellcheck="false">
        <div class="hint" id="roomHint"></div>
      </div>
      <div class="sheet-actions">
        <button class="btn primary" data-act="room-open-create">새 방 만들기</button>
      </div>
      <div class="hr"></div>
      <p><b>방 코드로 들어가기</b></p>
      <div style="margin-top:10px">
        <input class="field" id="roomJoinCode" placeholder="6자리 코드" maxlength="80"
               value="${esc(preset)}" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      <div class="sheet-actions">
        <button class="btn" data-act="room-join">들어가기</button>
      </div>`
  }
  TW.SHEETS.create = () => `
    <h2>방 만들기</h2>
    <p><b>모드</b></p>
    <div class="room-options" id="roomModes">
      <button class="chip" data-rmode="versus" aria-pressed="${draft.kind === 'versus'}">같은 단어 대결</button>
      <button class="chip" data-rmode="setter" disabled>출제 대결</button>
      <button class="chip" data-rmode="relay" disabled>릴레이</button>
      <button class="chip" data-rmode="coop" disabled>협동</button>
    </div>
    <p><b>칸 수</b></p>
    <div class="room-options" id="roomSizes">
      ${[4, 5, 6, 7, 0].map((n) => `<button class="chip" data-rsize="${n}" aria-pressed="${draft.size === n}">${n || '랜덤'}${n ? '칸' : ''}</button>`).join('')}
    </div>
    <p class="muted">현재는 같은 단어 대결을 먼저 지원합니다. 나머지 모드는 단계적으로 열립니다.</p>
    <div class="sheet-actions">
      <button class="btn primary" data-act="room-create">방 만들기</button>
    </div>`
  TW.SHEETS.roommenu = () => {
    if (!room) return '<h2>방을 찾지 못했어요</h2>'
    const elapsed = room.startedAt ? Math.floor((Date.now() - room.startedAt) / 1000) : 0
    return `
      <h2>대결 메뉴</h2>
      <p class="muted">방 코드 <b>${esc(room.code)}</b> · ${Math.floor(elapsed / 60)}분 ${elapsed % 60}초</p>
      <div class="sheet-actions">
        <button class="btn ghost" data-act="room-copy">초대 ${TW.shareUrl() ? '링크' : '코드'} 복사</button>
        ${room.host && room.startedAt && !room.over ? '<button class="btn accent" data-act="room-force">모두 강제 종료</button>' : ''}
        <button class="btn ghost" data-go="leave">방 나가기</button>
      </div>`
  }

  TW.GOES.rooms = () => TW.openSheet('rooms')
  TW.GOES.leave = leaveRoom
  TW.ACTIONS['room-open-create'] = () => {
    const nick = readNick()
    if (!nick) return
    TW.store.set('tw.player.v1', { ...savedPlayer(), nick })
    TW.openSheet('create')
  }
  TW.ACTIONS['room-create'] = () => enterRoom(Net.roomCode(), savedPlayer().nick, draft)
  TW.ACTIONS['room-join'] = () => {
    const nick = readNick()
    const code = normalizeCode($('#roomJoinCode')?.value)
    if (!nick) return
    if (!code) return setRoomHint('6자리 방 코드를 확인해 주세요')
    enterRoom(code, nick, { kind: 'versus', size: 5, roundsTotal: 1 })
  }
  TW.ACTIONS['room-start'] = startRound
  TW.ACTIONS['room-force'] = forceRound
  TW.ACTIONS['room-copy'] = () => TW.copyAndTell(inviteText(), TW.shareUrl() ? '초대 링크를 복사했어요' : '방 코드를 복사했어요')
  TW.ACTIONS['room-copy-result'] = copyResult

  function readNick() {
    const input = $('#roomNick')
    const nick = String(input?.value || savedPlayer().nick).trim().replace(/\s+/g, ' ').slice(0, 16)
    if (!nick) { setRoomHint('닉네임을 입력해 주세요'); input?.focus(); return null }
    return nick
  }
  function setRoomHint(message) {
    const hint = $('#roomHint')
    if (hint) { hint.textContent = message; hint.className = 'hint bad' }
  }

  function showLobby() {
    TW.closeSheet()
    $('#home').hidden = true
    $('#game').hidden = true
    $('#lobby').hidden = false
    $('#roomCode').textContent = room.code
    const base = TW.shareUrl()
    $('#roomInvite').innerHTML = `<div class="room-invite">
      ${base ? `<textarea class="linkbox" readonly>${esc(inviteText())}</textarea>` : '<p class="muted" style="text-align:left;flex:1">게임 주소와 이 코드를 함께 보내세요.</p>'}
      <button class="btn ghost" data-act="room-copy">${base ? '링크 복사' : '코드 복사'}</button>
    </div>`
    renderLobby()
  }
  function renderLobby() {
    if (!room || $('#lobby').hidden) return
    const list = players().sort((a, b) => a.joinedAt - b.joinedAt || a.pid.localeCompare(b.pid))
    const names = new Map(displayNames(list))
    $('#roomCount').textContent = `${list.length}명`
    $('#roomRoster').innerHTML = list.map((player) => `<li>
      <b>${esc(names.get(player.pid))}${player.pid === room.me.pid ? ' (나)' : ''}</b>
      <span>${player.pid === room.hostPid ? '방장' : '참가자'}</span>
    </li>`).join('')
    const live = Net.status === 'live'
    $('#lobbyActions').innerHTML = room.host
      ? `<button class="btn primary" data-act="room-start" ${live ? '' : 'disabled'}>시작하기</button>
         <button class="btn ghost" data-go="leave">나가기</button>`
      : `<p class="muted">방장이 시작하기를 기다리는 중…</p><button class="btn ghost" data-go="leave">나가기</button>`
    $('#lobbyStatus').textContent = statusLabel(Net.status)
  }
  function statusLabel(status) {
    return ({ off: '오프라인', connecting: '연결하는 중…', live: '연결됨', retry: '다시 연결하는 중…', down: '연결을 기다리는 중…' })[status] || status
  }

  function enterRoom(code, nick, options, resume) {
    const old = savedPlayer()
    const me = { pid: old.pid, nick, joinedAt: Date.now(), role: 'player' }
    TW.store.set('tw.player.v1', { pid: me.pid, nick })
    draft = { ...draft, ...options }
    room = {
      code, kind: draft.kind, round: 1, roundsTotal: draft.roundsTotal,
      size: draft.size, me, host: false, hostPid: null,
      peers: new Map([[me.pid, { ...me, rows: [], status: 'waiting', online: true }]]),
      activePids: new Set(), results: new Map(), startedAt: null, answer: null, over: false,
      resume: resume || null,
    }
    globalThis.TWRoomHash = null
    persistRoom()
    showLobby()
    Net.connect(code, me).catch(() => {
      if (room?.code === code) TW.toast('방을 깨우는 중이에요. 자동으로 다시 연결할게요', 2600)
    })
  }
  function leaveRoom() {
    clearInterval(timer)
    timer = null
    Net.leave()
    room = null
    TW.store.set('tw.room.v1', null)
    document.body.classList.remove('watching')
    $('#keyboard').hidden = false
    $('.board-wrap').hidden = false
    $('#peers').hidden = true
    $('#btnBack').dataset.go = 'home'
    $('#btnMenu').dataset.sheet = 'stats'
    $('#btnMenu').textContent = '☰'
    $('#btnMenu').setAttribute('aria-label', '기록')
    TW.GOES.home()
  }

  function onRoster(roster) {
    if (!room) return
    const online = new Set()
    for (const person of roster) {
      online.add(person.pid)
      const previous = room.peers.get(person.pid) || { rows: [], status: room.startedAt ? 'spectator' : 'waiting' }
      room.peers.set(person.pid, { ...previous, ...person, online: true })
    }
    for (const player of room.peers.values()) player.online = online.has(player.pid)
    room.hostPid = Net.electHost(roster)
    room.host = room.hostPid === room.me.pid
    renderLobby()
    renderPeers()
  }
  function onStatus(status) {
    renderLobby()
    if (!room) return
    if (status === 'retry') TW.toast('연결이 끊겨 다시 연결하고 있어요', 2200)
    if (status === 'live') Net.send('sync?', { pid: room.me.pid })
  }

  function resolvedRoomSize() {
    return draft.size === 0 ? TW.SIZES[Math.floor(Math.random() * TW.SIZES.length)] : draft.size
  }
  function startRound() {
    if (!room?.host || Net.status !== 'live') return
    const size = resolvedRoomSize()
    const answer = TW.freeAnswer(size)
    const payload = { round: room.round, kind: room.kind, size, answer: H.encode(H.decompose(answer)), setter: null, ts: Date.now() }
    Net.send('start', payload)
    beginRound(payload)
  }
  function decodeAnswer(value) {
    try { return H.compose(H.decode(String(value || ''))) } catch (e) { return null }
  }
  function beginRound(payload, spectator) {
    if (!room || Number(payload.round) < room.round) return
    const answer = decodeAnswer(payload.answer)
    if (!answer || !TW.SIZES.includes(Number(payload.size))) return
    room.round = Number(payload.round) || 1
    room.kind = payload.kind || 'versus'
    room.size = Number(payload.size)
    room.answer = answer
    room.startedAt = Date.now()
    room.over = false
    room.results = new Map()
    room.activePids = new Set(players().filter((p) => p.online).map((p) => p.pid))
    for (const player of room.peers.values()) {
      player.rows = []
      player.status = spectator && player.pid === room.me.pid ? 'spectator' : 'playing'
      player.tries = null
      player.ms = null
    }
    room.me.role = spectator ? 'spectator' : 'player'
    TW.startGame(room.kind, room.size, answer)
    $('#btnBack').dataset.go = 'leave'
    $('#btnMenu').dataset.sheet = 'roommenu'
    $('#btnMenu').textContent = '☰'
    $('#btnMenu').setAttribute('aria-label', '대결 메뉴')
    document.body.classList.toggle('watching', Boolean(spectator))
    $('#keyboard').hidden = Boolean(spectator)
    $('.board-wrap').hidden = Boolean(spectator)
    $('#peers').hidden = false
    renderPeers()
    startTimer()
    persistRoom()
  }
  function startTimer() {
    clearInterval(timer)
    const tick = () => {
      if (!room?.startedAt || room.over) return
      const seconds = Math.floor((Date.now() - room.startedAt) / 1000)
      const mm = String(Math.floor(seconds / 60)).padStart(2, '0')
      const ss = String(seconds % 60).padStart(2, '0')
      $('#gameSub').textContent = `${room.size}칸 · ${mm}:${ss}`
    }
    tick()
    timer = setInterval(tick, 1000)
  }

  function localMark(row, marks) {
    if (!room) return
    const player = room.peers.get(room.me.pid)
    if (player) playerRows(player)[row] = marks.slice()
    Net.send('mark', { pid: room.me.pid, row, marks: marks.map((m) => MARK_TO_WIRE[m]).join('') })
    renderPeers()
    persistRoom()
  }
  function localDone(status, tries) {
    if (!room || room.me.role === 'spectator') return
    const result = { pid: room.me.pid, status, tries, ms: Date.now() - room.startedAt }
    room.results.set(result.pid, result)
    Object.assign(room.peers.get(result.pid), result)
    Net.send('done', result)
    renderPeers()
    persistRoom()
    maybeFinish()
  }
  function onMark(payload) {
    if (!room || !room.startedAt || payload.pid === room.me.pid) return
    const player = room.peers.get(String(payload.pid))
    if (!player || !/^[012]+$/.test(String(payload.marks)) || String(payload.marks).length !== room.size) return
    const row = Number(payload.row)
    if (!(row >= 0 && row < TW.MAX_TRIES)) return
    playerRows(player)[row] = Array.from(String(payload.marks), (n) => WIRE_TO_MARK[Number(n)] || 'absent')
    renderPeers()
  }
  function onDone(payload) {
    if (!room || !room.startedAt || payload.pid === room.me.pid) return
    const player = room.peers.get(String(payload.pid))
    if (!player) return
    const result = {
      pid: player.pid,
      status: payload.status === 'won' ? 'won' : 'lost',
      tries: Math.max(1, Math.min(TW.MAX_TRIES, Number(payload.tries) || TW.MAX_TRIES)),
      ms: Math.max(0, Number(payload.ms) || 0),
    }
    room.results.set(result.pid, result)
    Object.assign(player, result)
    renderPeers()
    maybeFinish()
  }
  function maybeFinish() {
    if (!room?.host || room.over || !room.activePids.size) return
    if (Array.from(room.activePids).every((pid) => room.results.has(pid))) finishRound()
  }
  function forceRound() {
    if (!room?.host || room.over) return
    const elapsed = Date.now() - room.startedAt
    for (const pid of room.activePids) {
      if (!room.results.has(pid)) room.results.set(pid, { pid, status: 'lost', tries: TW.MAX_TRIES, ms: elapsed })
    }
    finishRound()
  }
  function finishRound() {
    if (!room || room.over) return
    room.over = true
    const scores = Array.from(room.results.values())
    const payload = { round: room.round, scores }
    Net.send('over', payload)
    TW.applyRemote(() => showScoreboard(scores))
  }
  function onOver(payload) {
    if (!room || Number(payload.round) !== room.round || !Array.isArray(payload.scores)) return
    TW.applyRemote(() => showScoreboard(payload.scores))
  }
  function sortedResults(results) {
    return results.slice().sort((a, b) => {
      if (a.status === 'won' && b.status !== 'won') return -1
      if (a.status !== 'won' && b.status === 'won') return 1
      return (a.tries || 99) - (b.tries || 99) || (a.ms || Infinity) - (b.ms || Infinity)
    })
  }
  function showScoreboard(results) {
    if (!room) return
    clearInterval(timer)
    room.over = true
    room.scoreResults = sortedResults(results)
    TW.endRoomGame()
    persistRoom()
    TW.openSheet('scoreboard')
  }
  TW.SHEETS.scoreboard = () => {
    const list = room?.scoreResults || []
    const names = new Map(displayNames(players().sort((a, b) => a.joinedAt - b.joinedAt)))
    return `
      <h2>대결 결과</h2>
      <div class="answer-reveal"><b>${esc(room?.answer || '')}</b><span>${room?.size || ''}칸</span></div>
      <ol class="score-list">${list.map((result, i) => `<li>
        <strong>${i + 1}</strong><b>${esc(names.get(result.pid) || '나간 참가자')}</b>
        <span>${result.status === 'won' ? `${result.tries}/${TW.MAX_TRIES} · ${(result.ms / 1000).toFixed(1)}초` : `X/${TW.MAX_TRIES}`}</span>
      </li>`).join('')}</ol>
      <div class="sheet-actions">
        <button class="btn accent" data-act="room-copy-result">결과 복사하기</button>
        <button class="btn ghost" data-go="leave">나가기</button>
      </div>`
  }
  function copyResult() {
    const rows = room.scoreResults.map((result, i) => `${i + 1}. ${room.peers.get(result.pid)?.nick || '나간 참가자'} · ${result.status === 'won' ? `${result.tries}/${TW.MAX_TRIES} · ${(result.ms / 1000).toFixed(1)}초` : `X/${TW.MAX_TRIES}`}`)
    TW.copyAndTell([`오늘의 단어 같이 하기 · ${room.size}칸`, `정답 ${room.answer}`, ...rows, inviteText()].join('\n'), '대결 결과를 복사했어요')
  }

  function renderPeers() {
    if (!room || !room.startedAt) return
    const peerList = players().filter((p) => p.pid !== room.me.pid)
    const names = new Map(displayNames(players().sort((a, b) => a.joinedAt - b.joinedAt)))
    $('#peers').innerHTML = peerList.map((player) => {
      const rows = Array.from({ length: TW.MAX_TRIES }, (_, row) => {
        const marks = player.rows?.[row] || []
        return `<div class="mini-row" style="--cols:${room.size}">${Array.from({ length: room.size }, (_, col) => `<i class="mini-tile ${marks[col] || ''}"></i>`).join('')}</div>`
      }).join('')
      return `<div class="peer ${player.online ? '' : 'offline'} ${player.status === 'won' || player.status === 'lost' ? 'done' : ''}" data-pid="${esc(player.pid)}">
        <b>${esc(names.get(player.pid))}</b><div class="mini">${rows}</div>
      </div>`
    }).join('')
  }

  function onSyncRequest(payload) {
    if (!room?.host || !room.startedAt || payload.pid === room.me.pid) return
    const boards = {}
    for (const player of room.peers.values()) boards[player.pid] = (player.rows || []).map((marks) => (marks || []).map((m) => MARK_TO_WIRE[m]).join(''))
    Net.send('sync!', {
      pid: payload.pid, round: room.round, kind: room.kind, size: room.size,
      answer: H.encode(H.decompose(room.answer)), ts: Date.now(), boards,
      scores: Array.from(room.results.values()), over: room.over,
    })
  }
  function onSync(payload) {
    if (!room || payload.pid !== room.me.pid || room.startedAt) return
    const resume = room.resume
    const canResume = Boolean(resume?.active && Number(resume.round) === Number(payload.round))
    beginRound(payload, !canResume)
    if (canResume) {
      const guesses = (resume.guesses || []).map((guess) => H.decode(String(guess)))
      TW.restoreRoomGame(guesses, resume.status)
      room.me.role = 'player'
    }
    room.resume = null
    for (const [pid, rows] of Object.entries(payload.boards || {})) {
      const player = room.peers.get(pid)
      if (!player) continue
      player.rows = rows.map((marks) => Array.from(String(marks), (n) => WIRE_TO_MARK[Number(n)] || 'absent'))
    }
    for (const result of payload.scores || []) room.results.set(result.pid, result)
    renderPeers()
    if (payload.over) showScoreboard(Array.from(room.results.values()))
  }

  document.addEventListener('click', (event) => {
    const target = event.target.closest('[data-rmode],[data-rsize]')
    if (!target || target.disabled) return
    if (target.dataset.rmode) draft.kind = target.dataset.rmode
    if (target.dataset.rsize !== undefined) draft.size = Number(target.dataset.rsize)
    const parent = target.parentElement
    for (const chip of parent.querySelectorAll('.chip')) chip.setAttribute('aria-pressed', String(chip === target))
  })
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return
    if (event.target.id === 'roomJoinCode') TW.ACTIONS['room-join']()
    else if (event.target.id === 'roomNick' && $('#roomJoinCode')?.value) TW.ACTIONS['room-join']()
  })

  Net.on('roster', onRoster)
  Net.on('status', onStatus)
  Net.on('start', (payload) => beginRound(payload, false))
  Net.on('mark', onMark)
  Net.on('done', onDone)
  Net.on('over', onOver)
  Net.on('sync?', onSyncRequest)
  Net.on('sync!', onSync)

  const roomButton = $('#btnRooms')
  if (Net.available) {
    roomButton.hidden = false
    const resume = TW.store.get('tw.room.v1', null)
    if (globalThis.TWRoomHash) setTimeout(() => TW.openSheet('rooms'), 0)
    else if (resume?.code && resume?.nick) setTimeout(() => enterRoom(
      resume.code, resume.nick,
      { kind: resume.kind || 'versus', size: Number(resume.size) || 5, roundsTotal: Number(resume.roundsTotal) || 1 },
      resume,
    ), 0)
  } else {
    // 설정이 없을 때는 기존 홈 DOM/레이아웃까지 동일하게 유지한다.
    roomButton.remove()
    globalThis.TWRoomHash = null
  }

  globalThis.Room = {
    get current() { return room },
    localMark, localDone, leave: leaveRoom,
    normalizeCode, repaintPeers: renderPeers,
  }
})()
</script>
</body>
</html>
